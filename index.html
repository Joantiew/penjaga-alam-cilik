<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Penjaga Alam Cilik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Konsep: peta pengembaraan hutan. Papan tanda kayu, hijau daun, biru sungai, bahan 3D tanah liat. */
:root{
  --bg:#e4f5dc; --bg2:#cdeabf; --card:#ffffff; --card2:#f3fbee;
  --ink:#1c3828; --ink2:#46604f; --line:#c3e0b6;
  --leaf:#2a8f45; --leaf-d:#1b7536; --leaf-t:#ffffff;
  --water:#1f86d0; --water-bg:#dcf0ff;
  --wood:#8a5326; --wood-l:#c98f51; --wood-d:#4a2a10;
  --sun:#ffc83d; --ok:#17803f; --ok-bg:#d6f4df; --bad:#b4400c; --bad-bg:#ffe6d6;
  --shadow:rgba(28,70,40,.2); --btn-edge:#14562a;
  --f-d:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e2117; --bg2:#14301f; --card:#173a26; --card2:#1c4630;
  --ink:#eaf7e8; --ink2:#a9cdb4; --line:#2d6143;
  --leaf:#46b862; --leaf-d:#2c9448; --leaf-t:#08210f;
  --water:#6cc0f7; --water-bg:#14405f;
  --ok:#6fe39a; --ok-bg:#145232; --bad:#ffb28a; --bad-bg:#5b2a12;
  --shadow:rgba(0,0,0,.4); --btn-edge:#1a6b34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e2117; --bg2:#14301f; --card:#173a26; --card2:#1c4630;
  --ink:#eaf7e8; --ink2:#a9cdb4; --line:#2d6143;
  --leaf:#46b862; --leaf-d:#2c9448; --leaf-t:#08210f;
  --water:#6cc0f7; --water-bg:#14405f;
  --ok:#6fe39a; --ok-bg:#145232; --bad:#ffb28a; --bad-bg:#5b2a12;
  --shadow:rgba(0,0,0,.4); --btn-edge:#1a6b34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:600 18px/1.55 var(--f-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-d);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.6rem,4.4vw,2.4rem);font-weight:800}
h3{font-size:1.35rem;font-weight:700}
p{margin:0}
a{color:var(--water)}
.wrap{max-width:1040px;margin-inline:auto}
.ic{width:1.25em;height:1.25em;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:12px}

/* Header */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:40;max-width:1040px;margin:0 auto 18px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;border-radius:22px;
  background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line),0 10px 20px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font:800 1.15rem/1 var(--f-d);color:var(--ink);margin-right:auto;min-width:0}
.brand span{white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font:800 .95rem var(--f-d);flex:1 1 200px;min-width:160px;max-width:340px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd35c,#2a8f45);border-radius:99px;transition:width .5s}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card2);
  color:var(--ink);font:800 .95rem var(--f-d);cursor:pointer}
.tbtn:hover{background:var(--bg2)}
.who{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.tbtn .lbl{display:none}.tbtn{padding:6px 11px}.brand span{display:none}.prog{max-width:none}}

/* Buttons */
.btn{font:800 1.2rem/1.1 var(--f-d);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:58px;padding:.5em 1.4em;
  border-radius:18px;border:0;cursor:pointer;color:var(--leaf-t);text-decoration:none;
  background:linear-gradient(var(--leaf),var(--leaf-d));box-shadow:0 6px 0 var(--btn-edge),0 12px 20px var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-edge)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.blue{background:linear-gradient(#2f9be6,#1769ad);color:#fff;box-shadow:0 6px 0 #0f4c7e,0 12px 20px var(--shadow)}
.btn.big{font-size:1.45rem;min-height:68px;padding-inline:1.8em}
.btn.sm{min-height:48px;font-size:1rem;padding:.4em 1em;box-shadow:0 4px 0 var(--btn-edge)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;filter:grayscale(.5);transform:none}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* Cards */
.card{background:var(--card);border-radius:28px;padding:clamp(16px,3vw,30px);border:2px solid var(--line);box-shadow:0 8px 0 var(--line),0 16px 32px var(--shadow)}
.card.soft{background:var(--card2);box-shadow:none}
.art{border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.08),0 14px 26px var(--shadow);background:#bfe9ff;line-height:0}
.art img{width:100%;height:auto;display:block;object-fit:cover}
.art.v{max-width:360px;width:100%;margin-inline:auto}
.q .art.v{margin:0}
.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:40% 35%;border:3px solid #fff;box-shadow:0 2px 6px var(--shadow);flex:none}
.eyebrow{font:800 .9rem var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--leaf)}
:root[data-theme="dark"] .eyebrow{color:var(--leaf)}
.lead{font-size:1.25rem;color:var(--ink2)}
.stack{display:grid;gap:22px}
.pagehead{display:grid;gap:8px;margin-bottom:22px}
.pagehead p{color:var(--ink2);font-size:1.15rem;max-width:62ch}

/* Page 1 */
.p1{display:grid;gap:26px;align-items:center;grid-template-columns:1fr}
@media (min-width:900px){.p1{grid-template-columns:1fr 1.15fr}.p1 .p1-art{order:2}}
.p1-body{display:grid;gap:18px;min-width:0}
.field{display:grid;gap:8px}
.field label{font:800 1.15rem var(--f-d)}
.field input{font:700 1.35rem var(--f-b);min-height:62px;padding:.4em .9em;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.field input:focus{border-color:var(--water);outline:4px solid color-mix(in srgb,var(--sun) 70%,transparent)}
.err{color:var(--bad);font-weight:800;min-height:1.4em}
.mission{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.mission li{display:flex;gap:10px;align-items:flex-start}
.mission li svg{color:var(--leaf);margin-top:.2em}

/* Story */
.story-row{display:grid;gap:18px;align-items:center;grid-template-columns:1fr}
@media (min-width:820px){.story-row{grid-template-columns:1fr 1fr}.story-row:nth-child(even) .art{order:2}}
.story-row .tx{display:grid;gap:10px}

/* Map */
.mapwrap{position:relative;width:min(100%,640px);margin:0 auto;aspect-ratio:600/1100;border-radius:30px;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.08),0 18px 34px var(--shadow);background:#bfe9ff;line-height:0}
.mapwrap>img.mapbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.node{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:7px;text-align:left;cursor:pointer;line-height:1.1;
  font:800 clamp(.9rem,2.9vw,1.1rem) var(--f-d);color:#fff;text-decoration:none;
  background:linear-gradient(var(--wood-l),var(--wood));border:3px solid var(--wood-d);border-radius:14px;padding:6px 12px 6px 6px;box-shadow:0 5px 0 var(--wood-d),0 10px 14px rgba(0,0,0,.25);max-width:46%;transition:transform .12s}
.node:hover{transform:translate(-50%,-54%)}
.node .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--wood-d);display:grid;place-items:center;font-size:1rem}
.node .tick{position:absolute;right:-12px;top:-14px;width:30px;height:30px;border-radius:50%;background:#17a047;border:3px solid #fff;display:grid;place-items:center;color:#fff}
.node .tick .ic{width:16px;height:16px}
.node.lock{filter:saturate(.5)}
.node.info{background:linear-gradient(#6aaee0,#2c6fa8);border-color:#17426a;box-shadow:0 5px 0 #17426a,0 10px 14px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin-top:18px;font-size:1rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:8px}

/* Biodata */
.bio{display:grid;gap:0;margin:0}
.bio div{display:grid;grid-template-columns:minmax(120px,.8fr) 1.6fr;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.bio div:last-child{border:0}
.bio dt{font:800 1rem var(--f-d);color:var(--leaf);text-transform:uppercase;letter-spacing:.08em}
.bio dd{margin:0;font:800 1.2rem var(--f-d);overflow-wrap:anywhere}
@media (max-width:480px){.bio div{grid-template-columns:1fr;gap:2px}}

/* Verb cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.vcard{display:grid;gap:12px;align-content:start;min-width:0}
.vcard .w{font:800 1.7rem var(--f-d);color:var(--leaf);line-height:1}
.vcard .m{color:var(--ink2);font-size:1.05rem}
.sent{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.part{display:inline-flex;flex-direction:column;gap:2px;padding:6px 14px 8px;border-radius:14px;border:3px solid;font:800 1.35rem/1.2 var(--f-d)}
.part small{font:800 .72rem var(--f-b);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.part.s{background:var(--water-bg);border-color:var(--water);color:var(--ink)}
.part.k{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.part.o{background:#ffe9bf;border-color:#d38a0a;color:#3b2a05}
:root[data-theme="dark"] .part.o{background:#5c4210;color:#ffe9bf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .part.o{background:#5c4210;color:#ffe9bf}}
.part.n{background:var(--card2);border-color:var(--line);color:var(--ink)}

/* Audio */
.wcard{display:grid;gap:12px;align-content:start;min-width:0}
.wcard .w{font:800 2rem var(--f-d);color:var(--leaf);line-height:1}
.wcard .s{font:700 1.25rem/1.35 var(--f-d)}
.aud{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;width:100%;border-radius:16px;border:0;cursor:pointer;color:#fff;font:800 1.05rem var(--f-d);padding:.4em .8em;text-align:center;line-height:1.15}
.aud.wd{background:linear-gradient(#2f9be6,#1769ad);box-shadow:0 5px 0 #0f4c7e}
.aud.y{background:linear-gradient(#f0a52a,#c9770b);box-shadow:0 5px 0 #7a4707}
.aud:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.aud.playing{outline:4px solid var(--sun);outline-offset:2px}
.aud.playing .ic{animation:pulse .7s infinite alternate}
.aud[disabled]{background:var(--bg2);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line);cursor:not-allowed}
.tickbtn{display:flex;align-items:center;gap:10px;min-height:50px;width:100%;border-radius:14px;border:3px dashed var(--line);background:transparent;color:var(--ink);font:800 1rem var(--f-d);padding:.3em .8em;cursor:pointer;text-align:left}
.tickbtn .bx{width:28px;height:28px;border-radius:8px;border:3px solid var(--ink2);display:grid;place-items:center;flex:none;color:transparent}
.tickbtn[aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.tickbtn[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.pills{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:0;padding:0;list-style:none}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:var(--card2);border:2px solid var(--line);font:700 .95rem var(--f-b);overflow-wrap:anywhere}
.pill.ok{background:var(--ok-bg);border-color:var(--ok)}
.pill .d{width:14px;height:14px;border-radius:50%;background:var(--ink2);flex:none;opacity:.5}
.pill.ok .d{background:var(--ok);opacity:1}
details.tch{border-radius:20px;border:2px solid var(--line);background:var(--card2);padding:14px 18px}
details.tch summary{font:800 1.1rem var(--f-d);cursor:pointer;min-height:36px;display:flex;align-items:center}
details.tch .in{display:grid;gap:14px;margin-top:12px;font-size:1rem}
code{font:700 .95em ui-monospace,Menlo,Consolas,monospace;background:var(--bg2);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.note{padding:12px 16px;border-radius:16px;background:var(--water-bg);border:2px solid var(--water);font-size:1rem}
.note.warn{background:#fff1c9;border-color:#d9a017;color:#4a3503}
:root[data-theme="dark"] .note.warn{background:#4d3c0b;color:#ffeab0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note.warn{background:#4d3c0b;color:#ffeab0}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.25)}}

/* Song */
.lyr{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.lyr .card{display:grid;gap:10px;align-content:start}
.lyr .tag{font:800 .95rem var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}
.lyr p{font:700 1.35rem/1.5 var(--f-d)}
.lyr .chorus{background:linear-gradient(160deg,#fff4c2,#ffe08a);border-color:#e0b53a;color:#3a2a05}
.lyr .chorus .tag{color:#8a5a00}
:root[data-theme="dark"] .lyr .chorus{background:linear-gradient(160deg,#5c4a12,#7a5f12);color:#fff1c2}
:root[data-theme="dark"] .lyr .chorus .tag{color:#ffd966}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lyr .chorus{background:linear-gradient(160deg,#5c4a12,#7a5f12);color:#fff1c2}:root:not([data-theme="light"]) .lyr .chorus .tag{color:#ffd966}}
audio{width:100%;max-width:560px}

/* Exercise */
.ex{display:grid;gap:18px}
.ex-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.ex-g{font:800 .95rem var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--leaf)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--bg2);border:2px solid var(--line)}
.dots i.cur{border-color:var(--water);background:var(--water-bg)}
.dots i.r{background:var(--ok);border-color:var(--ok)}
.dots i.x{background:var(--bad);border-color:var(--bad)}
.q{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
.q.has-art{grid-template-columns:1fr}
@media (min-width:760px){.q.has-art{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.q .qp{font:800 clamp(1.3rem,3.6vw,1.8rem)/1.25 var(--f-d)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:800 1.2rem/1.25 var(--f-b);padding:.7em 1em;border-radius:18px;border:3px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;min-height:58px;width:100%;box-shadow:0 4px 0 var(--line)}
.opt:hover:not([disabled]){border-color:var(--water)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 1rem var(--f-d)}
.opt[aria-pressed="true"]{border-color:var(--water);background:var(--water-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chips .opt{width:auto;font:800 1.45rem var(--f-d);padding:.5em 1em;min-height:62px}
.fb{display:flex;gap:14px;align-items:center;padding:12px 18px;border-radius:18px;font-size:1.1rem;border:3px solid}
.fb .rb{flex:none;width:56px;line-height:0}.fb>div{display:grid;gap:4px;min-width:0}
.bio-grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:760px){.bio-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.portrait{margin:0;width:100%;max-width:420px;justify-self:center;aspect-ratio:835/894;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.07),0 16px 30px var(--shadow);background:var(--bg2);line-height:0}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.vid{width:100%;max-width:900px;margin-inline:auto;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.08),0 16px 30px var(--shadow);line-height:0}
.vid video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.bdgrow{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center}
.bdgf{margin:0;width:96px;text-align:center;font:800 .82rem/1.15 var(--f-d);color:var(--ink2);display:grid;gap:4px;justify-items:center}
.bdg{display:block;width:80px;height:80px;border-radius:50%;overflow:hidden;border:5px solid #f0b92b;box-shadow:0 0 0 3px #fff,0 6px 10px rgba(0,0,0,.25);background:#fff}
.bdg img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.bdg.off{filter:grayscale(1) opacity(.45)}
.bdgbig .bdg{width:108px;height:108px}
.stars .ic{width:34px;height:34px}
.fb b{font:800 1.3rem var(--f-d)}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.result{display:grid;gap:16px;justify-items:center;text-align:center;padding:10px 0}
.score{font:800 clamp(3.6rem,14vw,6rem)/1 var(--f-d);color:var(--leaf)}
.stars{display:flex;gap:6px;color:#f2b21a}
.stars .ic{width:46px;height:46px}
.stars .off{color:var(--line)}

/* Types page */
.tcards{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tcard{display:grid;gap:12px;align-content:start;min-width:0}
.tcard .rule{color:var(--ink2);font-size:1.05rem}
.donebadge{display:inline-flex;align-items:center;gap:6px;font:800 .9rem var(--f-d);color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:3px 12px;width:max-content}
.todo{background:var(--card2);color:var(--ink2)}
.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

/* Bottom nav */
.nav{position:sticky;bottom:0;z-index:40;max-width:1040px;margin:34px auto 0;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--card);border:2px solid var(--line);border-bottom:0;box-shadow:0 -6px 20px var(--shadow)}

.cstrip{position:absolute;left:2.6cqw;right:2.6cqw;bottom:2.6cqw;width:calc(100% - 5.2cqw);height:6.5cqw;object-fit:cover;object-position:50% 60%;border-radius:0 0 1.2cqw 1.2cqw;display:block}

.cin h2{font-size:5.4cqw;font-weight:800;color:#1b6a34;letter-spacing:.02em;text-wrap:balance}
.cin .t{font:700 2.05cqw/1.3 var(--f-b);color:#2f4a3a;max-width:70cqw}
.cin .nm{font-size:6.6cqw;font-weight:800;color:#a85a10;padding:0 3cqw .5cqw;border-bottom:.45cqw solid #e0b53a;min-width:46cqw;max-width:82cqw;overflow-wrap:anywhere;line-height:1.05;margin-top:.8cqw}
.sigrow{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:3cqw;margin-top:1.6cqw}

.sigrow .b .line{width:100%;max-width:30cqw;border-bottom:.3cqw solid #24402f;height:4.6cqw;display:flex;align-items:flex-end;justify-content:center;font-weight:800;font-size:2.4cqw;padding-bottom:.4cqw}

try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){state.name=typeof o.name==='string'?o.name:'';state.done=o.done||{};state.ex=o.ex||{};state.ticks=o.ticks||{};}}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function doneCount(){return TASKS.filter(function(t){return state.done[t.id];}).length;}
function allDone(){return doneCount()===TASKS.length;}
function pendingTasks(){return TASKS.filter(function(t){return !state.done[t.id];});}

/* ============ Audio ============ */
var AKEYS=[];WORDS.forEach(function(w){AKEYS.push(w.k);AKEYS.push('ayat_'+w.k);});
var SONG='jom_jaga_alam';
var AUD={url:{},st:{}};
function audioReady(k){return !!AUD.url[k];}
function nrm(n){return n.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[\s\-]+/g,'_');}
var DB={
 open:function(){return new Promise(function(res,rej){try{var r=indexedDB.open('pkpa-audio',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});},
 put:function(k,b){return DB.open().then(function(d){return new Promise(function(res,rej){var t=d.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});},
 all:function(){return DB.open().then(function(d){return new Promise(function(res,rej){var out={},t=d.transaction('f','readonly'),c=t.objectStore('f').openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};c.onerror=function(){rej(c.error);};});});},
 clear:function(){return DB.open().then(function(d){return new Promise(function(res,rej){var t=d.transaction('f','readwrite');t.objectStore('f').clear();t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}
};
function probe(k){return new Promise(function(r){var a=new Audio(),done=false;function fin(ok){if(done)return;done=true;a.onerror=null;a.onloadedmetadata=null;r(ok);}a.preload='metadata';a.onloadedmetadata=function(){fin(true);};a.onerror=function(){fin(false);};setTimeout(function(){fin(false);},6000);a.src='audio/'+k+'.mp3';});}
function initAudio(){
 AKEYS.concat([SONG]).forEach(function(k){AUD.st[k]='checking';});
 var userFirst=DB.all().catch(function(){return {};});
 userFirst.then(function(blobs){
  Object.keys(blobs).forEach(function(k){try{AUD.url[k]=URL.createObjectURL(blobs[k]);AUD.st[k]='ready';AUD.user=AUD.user||{};AUD.user[k]=true;}catch(e){}});
  refreshAudio();
  return Promise.all(AKEYS.concat([SONG]).filter(function(k){return !AUD.url[k];}).map(function(k){return probe(k).then(function(ok){if(ok){AUD.url[k]='audio/'+k+'.mp3';AUD.st[k]='ready';}else AUD.st[k]='missing';refreshAudio();});}));
 });
}
var player=new Audio(),curBtn=null;
player.onended=function(){if(curBtn)curBtn.classList.remove('playing');};
function stopAudio(){try{player.pause();}catch(e){}if(curBtn)curBtn.classList.remove('playing');var v=document.getElementById('songVid');if(v)try{v.pause();}catch(e){}}
function playKey(k,btn){
 var u=AUD.url[k];if(!u)return;stopAudio();player.src=u;curBtn=btn;btn.classList.add('playing');
 var pr=player.play();if(pr&&pr.catch)pr.catch(function(){btn.classList.remove('playing');toast('Audio tidak dapat dimainkan. Semak fail MP3.');});
}
function btnLabel(k,kind){var st=AUD.st[k];if(st==='ready')return kind==='w'?'Dengar Perkataan':'Dengar Ayat';if(st==='checking')return 'Memeriksa audio...';return 'Audio belum disediakan';}
function refreshAudio(){
 document.querySelectorAll('[data-ak]').forEach(function(b){var k=b.getAttribute('data-ak'),kind=b.getAttribute('data-kind');var ok=AUD.st[k]==='ready';b.disabled=!ok;var s=b.querySelector('.tx');if(s)s.textContent=btnLabel(k,kind);b.setAttribute('aria-label',btnLabel(k,kind)+(b.getAttribute('data-word')?': '+b.getAttribute('data-word'):''));});
 document.querySelectorAll('[data-pill]').forEach(function(p){var k=p.getAttribute('data-pill'),ok=AUD.st[k]==='ready';p.classList.toggle('ok',ok);var t=p.querySelector('.st');if(t)t.textContent=ok?(AUD.user&&AUD.user[k]?'sedia (dipilih)':'sedia'):(AUD.st[k]==='checking'?'memeriksa':'belum ada');});
 var c=$('#audCount');if(c){c.textContent=AKEYS.filter(function(k){return AUD.st[k]==='ready';}).length+' / 16 fail audio perkataan dan ayat sedia';}
 var sb=$('#songBox');if(sb)sb.innerHTML=songBoxHTML();
}
function songBoxHTML(){
 var st=AUD.st[SONG];
 var inp='<label class="btn alt sm filebtn">'+ico('upload')+' Pilih rakaman lagu (MP3)<input type="file" id="songFile" accept="audio/*,.mp3" aria-label="Pilih rakaman lagu MP3"></label>';
 if(st==='ready')return '<div class="stack"><audio controls preload="none" src="'+AUD.url[SONG]+'" aria-label="Rakaman lagu Jom Jaga Alam"></audio><div class="row">'+inp+'<span class="hint">'+(AUD.user&&AUD.user[SONG]?'Rakaman dipilih daripada peranti ini.':'Rakaman dimuatkan daripada audio/'+SONG+'.mp3')+'</span></div></div>';
 return '<div class="stack"><div class="note warn">'+(st==='checking'?'Memeriksa rakaman lagu...':'Rakaman lagu belum disediakan. Pilih fail MP3 sendiri di bawah atau letak fail <code>audio/'+SONG+'.mp3</code> bersama laman web.')+'</div><div>'+inp+'</div></div>';
}
function handleFiles(files){
 var ok=0,bad=[];var list=Array.prototype.slice.call(files);var jobs=[];
 list.forEach(function(f){
  var k=nrm(f.name);
  if(AKEYS.indexOf(k)<0&&k!==SONG){ if(list.length===1&&$('#songFile')&&document.activeElement===$('#songFile')){k=SONG;} else {bad.push(f.name);return;} }
  try{AUD.url[k]=URL.createObjectURL(f);AUD.st[k]='ready';AUD.user=AUD.user||{};AUD.user[k]=true;ok++;jobs.push(DB.put(k,f).catch(function(){}));}catch(e){bad.push(f.name);}
 });
 refreshAudio();
 var m=ok+' fail audio disambungkan.'+(bad.length?' Nama tidak dikenali: '+bad.join(', ')+'.':'');
 var box=$('#loadMsg');if(box)box.textContent=m;toast(ok?ok+' fail audio disambungkan':'Tiada fail yang sepadan. Semak nama fail.');
}

var PR=['Syabas!','Hebat!','Bagus!','Tahniah!'];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function qType(q){return q.t||(q.chips?'chips':'mc');}
function bankLen(q){var t=qType(q);if(t==='match')return q.pairs.length;if(t==='order')return q.words.length;if(t==='type')return 0;return (q.chips||q.o).length;}
function perm(n,keep){var a=[],i;for(i=0;i<n;i++)a.push(i);if(keep||n<2)return a;var s;do{s=shuffle(a);}while(s.every(function(v,i){return v===i;}));return s;}
function resetQ(s){s.sel=null;s.chk=false;s.ans=[];s.typed='';s.m={};s.wr=0;s.pk=null;s.bad=null;s.last=null;s.mf=null;}
function exNew(id){var E=EXS[id];var s={i:0,res:[],fin:false,ord:E.qs.map(function(q){return perm(bankLen(q),!!q.chips);})};resetQ(s);return s;}
function exSt(id){var s=state.ex[id];if(!s||!s.ord||s.ord.length!==EXS[id].qs.length){s=state.ex[id]=exNew(id);}if(!s.m||!s.ans){var r=s.res,i=s.i,f=s.fin,o=s.ord;resetQ(s);s.res=r;s.i=i;s.fin=f;s.ord=o;}return s;}

}

 var q=E.qs[st.i],ord=st.ord[st.i],t=qType(q),items=q.chips||q.o;
 var dots='<div class="dots" aria-hidden="true">'+E.qs.map(function(_,i){var r=st.res[i];return '<i class="'+(i===st.i?'cur ':'')+(r?(r.ok?'r':'x'):'')+'"></i>';}).join('')+'</div>';
 var LAB={mc:'Pilihan jawapan',chips:'Cari kata kerja dalam ayat',match:'Padankan',order:'Susun perkataan menjadi ayat',fill:'Isi tempat kosong',type:'Isi tempat kosong dengan menaip'};
 var body='',corr='';
 if(t==='match'){body='<p class="hint">Seret kad jawapan ke kotak yang betul, atau sentuh satu kad kemudian sentuh pasangannya.</p>'+matchHTML(id,st,q);}
 else if(t==='order'){corr=q.words.join(' ');body='<p class="hint">Seret kad perkataan ke petak ayat, atau sentuh kad untuk memasukkannya. Sentuh perkataan dalam ayat untuk mengeluarkannya.</p>'+orderHTML(id,st,q,ord);}
 else if(t==='type'){corr=q.ans;var tc=st.chk?(st.last?' right':' wrong'):'';
  body='<div class="fillsent">'+blankSent(q.s,'<input class="tin'+tc+'" id="tin" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Taip kata kerja yang hilang" value="'+esc(st.typed)+'"'+(st.chk?' disabled':'')+'>')+'</div>';}
 else if(t==='fill'){corr=items[q.a];var bc=st.chk?(st.last?' right':' wrong'):'';
  body='<div class="fillsent">'+blankSent(q.s,'<span class="blank'+bc+'" data-drop="blank"'+(st.sel!==null&&!st.chk?' data-act="unpick" data-ex="'+id+'" role="button" tabindex="0"':'')+'>'+(st.sel!==null?esc(items[ord[st.sel]]):'&nbsp;')+'</span>')+'</div>'+
  '<div class="chips" role="group" aria-label="Pilih kata kerja">'+ord.map(function(oi,k){var pr=st.sel===k,cl='';if(st.chk){if(oi===q.a)cl=' right';else if(pr)cl=' wrong';}
   return '<button class="opt'+cl+'" data-drag="'+k+'" data-act="pick" data-ex="'+id+'" data-k="'+k+'" aria-pressed="'+pr+'"'+(st.chk?' disabled':'')+'><span>'+esc(items[oi])+'</span></button>';}).join('')+'</div>';}
 else{corr=items[q.a].replace(/\.$/,'');
  var opts=ord.map(function(oi,k){var cl='',pr=st.sel===k;if(st.chk){if(oi===q.a)cl=' right';else if(pr)cl=' wrong';}
   return '<button class="opt'+cl+'" data-act="pick" data-ex="'+id+'" data-k="'+k+'" aria-pressed="'+pr+'"'+(st.chk?' disabled':'')+'>'+(q.chips?'':'<span class="l">'+'ABCD'.charAt(k)+'</span>')+'<span>'+esc(items[oi])+'</span></button>';}).join('');
  body=q.chips?'<div class="chips" role="group" aria-label="Pilih satu perkataan">'+opts+'</div>':'<div class="opts" role="group" aria-label="Pilihan jawapan">'+opts+'</div>';}
 var fb='';
 if(t==='match'){
  if(st.chk)fb=fbBox(true,PR[st.i%4]+' Semua padanan betul.',(st.wr?'Ada '+st.wr+' cubaan yang salah, tetapi kamu berjaya. ':'')+q.w);
  else if(st.mf==='ok')fb=fbBox(true,'Betul!','Pasangan itu tepat. Teruskan memadankan.');
  else if(st.mf==='no')fb=fbBox(false,'Belum tepat.','Cuba lagi. Pilih pasangan yang lain.');
 }else if(st.chk){var ok=st.last;fb=fbBox(ok,ok?PR[st.i%4]+' Betul!':'Hampir betul. Cuba lagi!',(ok?'':'Jawapan yang betul: '+corr+'. ')+q.w);}
 var last=st.i===n-1,nb='<button class="btn" data-act="exNext" data-ex="'+id+'">'+(last?'Lihat Keputusan':'Soalan Seterusnya')+' '+ico('next')+'</button>',btn;
 if(t==='match')btn=st.chk?nb:'';
 else if(st.chk)btn=(st.last?'':'<button class="btn alt" data-act="exTry" data-ex="'+id+'">'+ico('reload')+' Cuba Lagi</button>')+nb;
 else{var dis=t==='order'?st.ans.length!==q.words.length:(t==='type'?!(st.typed||'').trim():st.sel===null);btn='<button class="btn" data-act="exCheck" data-ex="'+id+'"'+(dis?' disabled':'')+'>Semak Jawapan</button>';}
 return '<div class="ex-top"><span class="ex-g">'+esc(q.g||LAB[t])+' · Soalan '+(st.i+1)+' daripada '+n+'</span>'+dots+'</div>'+
 '<div class="q'+(q.art?' has-art':'')+'">'+(q.art?art(q.art):'')+'<div class="stack"><div class="qp">'+esc(q.p)+'</div>'+body+fb+'<div class="row">'+btn+'</div></div></div>';
}
function nextBtn(id){
 if(id==='cari')return '<button class="btn" data-act="jump" data-t="aksi">Ke Misi 2 '+ico('next')+'</button>';
 if(id==='bina')return '<button class="btn" data-act="jump" data-t="kuiz">Ke Misi 4 '+ico('next')+'</button>';
 var m={aksi:9,trans:11,tak:12,aktif:13,pasif:14,kuiz:15};return '<button class="btn" data-act="go" data-p="'+m[id]+'">'+(id==='kuiz'?'Ke Sijil':'Seterusnya')+' '+ico('next')+'</button>';}
function exRedraw(id){var b=$('[data-exbox="'+id+'"]');if(b)b.innerHTML=exHTML(id);}
function mtTry(id,li,ri){
 var st=exSt(id),q=EXS[id].qs[st.i];if(st.chk||st.m[li])return;st.pk=null;
 if(li===ri){st.m[li]=true;st.bad=null;st.mf='ok';
  if(Object.keys(st.m).length===q.pairs.length){if(!st.res[st.i])st.res[st.i]={ok:st.wr===0};st.chk=true;st.last=true;}}
 else{st.wr++;st.bad={li:li,ri:ri};st.mf='no';}
 save();exRedraw(id);
}
function ordMove(id,from,to){
 var st=exSt(id);if(st.chk)return;var ans=st.ans,k;
 if(from.charAt(0)==='b'){k=+from.slice(1);if(ans.indexOf(k)>=0)return;}else{k=ans.splice(+from.slice(1),1)[0];}
 if(to==='ans')ans.push(k);else if(to.charAt(0)==='a')ans.splice(+to.slice(1),0,k);
 save();exRedraw(id);
}
/* Seret dan lepas (Pointer Events: tetikus, sentuhan dan pen) */
var drag=null,noClick=0;
function dropAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-drop]'):null;}
function hilite(t){document.querySelectorAll('.over').forEach(function(o){if(o!==t)o.classList.remove('over');});if(t)t.classList.add('over');}
function endDrag(){if(drag){if(drag.g&&drag.g.parentNode)drag.g.parentNode.removeChild(drag.g);if(drag.el)drag.el.classList.remove('dragging');}hilite(null);drag=null;}
function onDrop(dEl,tEl){
 var box=dEl.closest('[data-exbox]');if(!box)return;var id=box.getAttribute('data-exbox'),st=exSt(id),q=EXS[id].qs[st.i],t=qType(q);
 var dv=dEl.getAttribute('data-drag'),dp=tEl.getAttribute('data-drop');
 if(t==='match'){mtTry(id,+dp,+dv);}
 else if(t==='order'){if(dEl===tEl)return;ordMove(id,dv,dp);}
 else if(t==='fill'&&dp==='blank'){if(st.chk)return;st.sel=+dv;save();exRedraw(id);}
}
document.addEventListener('pointerdown',function(e){
 if(e.button>0)return;var d=e.target.closest('[data-drag]');if(!d||d.disabled)return;
 drag={el:d,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,g:null};
});
document.addEventListener('pointermove',function(e){
 if(!drag||e.pointerId!==drag.id)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.on=true;
  var r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);g.removeAttribute('data-act');g.removeAttribute('data-drag');g.removeAttribute('data-drop');g.classList.add('ghost');g.style.width=r.width+'px';
  document.body.appendChild(g);drag.g=g;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;drag.el.classList.add('dragging');}
 drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';
 hilite(dropAt(e.clientX,e.clientY));if(e.cancelable)e.preventDefault();
});
document.addEventListener('pointerup',function(e){
 if(!drag||e.pointerId!==drag.id)return;
 if(drag.on){var t=dropAt(e.clientX,e.clientY),d=drag.el;noClick=Date.now()+450;endDrag();if(t&&t!==d)onDrop(d,t);}else drag=null;
});
document.addEventListener('pointercancel',function(){endDrag();});
document.addEventListener('click',function(e){if(Date.now()<noClick){e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.click();}
 if(e.key==='Enter'&&e.target.id==='tin'){var b=$('[data-exbox] [data-act="exCheck"]');if(b&&!b.disabled)b.click();}
});



/* ============ Penghalaan dan paparan ============ */
var cur=1;

function go(p){stopAudio();var h='#halaman-'+p;if(location.hash===h)render();else location.hash=h;}

 var p=pageFromHash();if(p!==1&&!state.name)p=1;cur=p;
 $('#view').innerHTML=PAGES[p].html();
 chrome();
 if(p===6||p===7)refreshAudio();

 window.scrollTo(0,0);
 if(p===1){var i=$('#nama');if(i&&!state.name){try{i.focus({preventScroll:true});}catch(e){}}}

 var has=!!state.name,n=doneCount(),T=TASKS.length;
 $('#top').innerHTML='<div class="brand"><img class="logo" src="media/aina-ali.jpg" alt="" draggable="false"><span>Penjaga Alam Cilik</span></div>'+
 (has?'<div class="prog" aria-label="Kemajuan misi"><span>'+n+'/'+T+'</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+T+'" aria-valuenow="'+n+'" aria-label="Misi selesai"><i style="width:'+(n/T*100)+'%"></i></div></div>'+
 '<div class="tb"><button class="tbtn" data-act="go" data-p="1" aria-label="Laman utama">'+ico('home')+'<span class="lbl">Utama</span></button><button class="tbtn" data-act="go" data-p="3" aria-label="Peta pengembaraan">'+ico('map')+'<span class="lbl">Peta</span></button><button class="tbtn" data-act="go" data-p="1" aria-label="Tukar nama">'+ico('edit')+'<span class="lbl who">'+esc(state.name)+'</span></button></div>':'');
 var nav=$('#nav');
 if(!has||cur===1){nav.classList.add('hide');}else{nav.classList.remove('hide');
  var nxt=cur<16?cur+1:null;
  nav.innerHTML='<button class="btn alt sm" data-act="go" data-p="'+(cur-1)+'" '+(cur<=1?'disabled':'')+'>'+ico('back')+' Kembali</button><div class="mid"><span>Halaman '+cur+' daripada 16</span><b>'+esc(PAGES[cur].t)+'</b></div>'+
  (nxt?'<button class="btn sm" data-act="go" data-p="'+nxt+'">Seterusnya '+ico('next')+'</button>':'<button class="btn sm" data-act="go" data-p="1">'+ico('home')+' Utama</button>');}

function markDone(id){if(!state.done[id]){state.done[id]=true;save();var h=$('.bar i');chrome();toast('Misi selesai: '+TASKS.filter(function(t){return t.id===id;})[0].t);}}

/* ============ Acara ============ */
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.getAttribute('data-act');
 if(a==='go'){var p=parseInt(b.getAttribute('data-p'),10);if(PAGES[p])go(p);return;}
 if(a==='play'){playKey(b.getAttribute('data-ak'),b);return;}
 if(a==='tick'){var k=b.getAttribute('data-k');state.ticks[k]=!state.ticks[k];save();b.setAttribute('aria-pressed',!!state.ticks[k]);var n=WORDS.filter(function(w){return state.ticks[w.k];}).length;$('#tickN').textContent=n;$('#finSebut').disabled=n<8||!!state.done.sebut;return;}
 if(a==='finishSebut'){markDone('sebut');b.disabled=true;b.innerHTML=ico('check')+' Misi ini selesai';return;}
 if(a==='clearAud'){DB.clear().catch(function(){}).then(function(){location.reload();});return;}
 if(a==='pick'){var id=b.getAttribute('data-ex'),st=exSt(id);if(st.chk)return;st.sel=parseInt(b.getAttribute('data-k'),10);save();exRedraw(id);return;}
 if(a==='unpick'){var idu=b.getAttribute('data-ex'),su=exSt(idu);if(su.chk)return;su.sel=null;save();exRedraw(idu);return;}
 if(a==='mtL'||a==='mtR'){var idm=b.getAttribute('data-ex'),sm=exSt(idm),im=parseInt(b.getAttribute('data-i'),10),sd=a==='mtL'?'l':'r';if(sm.chk)return;
  if(sm.pk&&sm.pk.s!==sd){if(sd==='l')mtTry(idm,im,sm.pk.i);else mtTry(idm,sm.pk.i,im);}else{sm.pk=(sm.pk&&sm.pk.i===im)?null:{s:sd,i:im};sm.bad=null;sm.mf=null;exRedraw(idm);}return;}
 if(a==='ordA'){ordMove(b.getAttribute('data-ex'),'a'+b.getAttribute('data-i'),'bank');return;}
 if(a==='ordB'){ordMove(b.getAttribute('data-ex'),'b'+b.getAttribute('data-i'),'ans');return;}
 if(a==='exTry'){var idt=b.getAttribute('data-ex'),stt=exSt(idt);stt.chk=false;stt.sel=null;stt.ans=[];stt.typed='';stt.last=null;save();exRedraw(idt);return;}
 if(a==='jump'){var jb=$('[data-exbox="'+b.getAttribute('data-t')+'"]');if(jb){var sc=jb.closest('section')||jb;sc.scrollIntoView({behavior:'smooth',block:'start'});}return;}
 if(a==='exCheck'){var id2=b.getAttribute('data-ex'),s2=exSt(id2);if(s2.chk)return;var q=EXS[id2].qs[s2.i],tq=qType(q),ok;
  if(tq==='type'){var tv=(s2.typed||'').trim().toLowerCase().replace(/\s+/g,' ');if(!tv)return;ok=tv===q.ans;}
  else if(tq==='order'){if(s2.ans.length!==q.words.length)return;ok=s2.ans.every(function(k,j){return q.words[s2.ord[s2.i][k]]===q.words[j];});}
  else{if(s2.sel===null)return;ok=s2.ord[s2.i][s2.sel]===q.a;}
  if(!s2.res[s2.i])s2.res[s2.i]={ok:ok};s2.last=ok;s2.chk=true;save();exRedraw(id2);var fb=$('[data-exbox="'+id2+'"] .fb');if(fb){fb.classList.add('bounce');}return;}
 if(a==='exNext'){var id3=b.getAttribute('data-ex'),s3=exSt(id3),n3=EXS[id3].qs.length;if(!s3.chk)return;if(s3.i>=n3-1){s3.fin=true;save();markDone(id3);}else{s3.i++;resetQ(s3);save();}exRedraw(id3);var bx=$('[data-exbox="'+id3+'"]');if(bx)bx.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(a==='exRetry'){var id4=b.getAttribute('data-ex');state.ex[id4]=exNew(id4);save();exRedraw(id4);return;}
 if(a==='print'){var m=$('#printMsg');$('#printRoot').innerHTML=certHTML();var framed=false;try{framed=window.self!==window.top;}catch(x){framed=true;}
   var imgs=Array.prototype.slice.call(document.querySelectorAll('#printRoot img'));Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve();})).then(function(){try{window.print();}catch(x){}});
   if(m){m.classList.remove('hide');m.textContent=framed?'Pratonton Artifact menyekat dialog cetak. Jika tiada dialog muncul, buka fail HTML sebenar (index.html) dalam pelayar anda, kemudian tekan Cetak Sijil. Pilih A4, landscape dan tanpa pengepala.':'Dialog cetak dibuka. Pilih A4, landscape dan tanpa pengepala. Pilih “Simpan sebagai PDF” untuk menyimpan.';}
   return;}
 if(a==='askReset'){$('#resetBox').classList.remove('hide');return;}
 if(a==='cancelReset'){$('#resetBox').classList.add('hide');return;}
 if(a==='doReset'){state.done={};state.ex={};state.ticks={};save();go(3);return;}
});
